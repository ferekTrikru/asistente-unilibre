<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Mis citas · Asistente Unilibre</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#c8102e" />
<meta name="color-scheme" content="light" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Asistente Unilibre" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --bg-well:#f3eeec; --surface:#faf7f6; --surface-2:#f2ebe9;
    --stroke:rgba(26,20,21,.11); --stroke-strong:rgba(26,20,21,.22);
    --text-primary:#1a1415; --text-secondary:#4d4344; --text-tertiary:#6f6466;
    --accent:#c8102e; --accent-bright:#e1251b; --accent-deep:#8a0b1f;
    --good:#13874b; --shadow-ambient:rgba(200,16,46,.22);
    --sun: #f2a900;
    --leaf: #e1251b;
    --font-display:'Playfair Display', Georgia, 'Times New Roman', serif;
    --font-sans:'Manrope',-apple-system,'Segoe UI',sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; overscroll-behavior:none; }
  body{ background:var(--bg-well); color:var(--text-primary); font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased; }
  button{ font-family:inherit; }
  a{ color:inherit; text-decoration:none; }

  .stage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(60% 45% at 50% 100%, rgba(200,16,46,.16), transparent 70%), var(--bg-well); }
  .app{ position:relative; width:100%; max-width:432px; height:100%; max-height:940px;
    display:flex; flex-direction:column; overflow:hidden; background:var(--bg); isolation:isolate; }
  @media (min-width:680px){
    .app{ height:min(92dvh, 940px); border-radius:34px;
      box-shadow:0 0 0 1px var(--stroke), 0 40px 100px -20px rgba(26,20,21,.22), 0 0 140px -40px var(--shadow-ambient); }
  }
  .ambient{ position:absolute; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(70% 38% at 50% 86%, rgba(200,16,46,.09), transparent 65%),
      radial-gradient(90% 42% at 50% 106%, rgba(242,169,0,.16), transparent 70%),
      linear-gradient(180deg, #ffffff 0%, #fdfbfa 55%, #f6efed 100%);
  }

  .topbar{ position:relative; z-index:3; display:flex; align-items:center; gap:12px;
    padding:max(18px, env(safe-area-inset-top)) 16px 8px; flex-shrink:0; }
  .iconbtn{ width:38px; height:38px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:1px solid transparent; color:var(--text-secondary);
    cursor:pointer; transition:background .18s ease, border-color .18s ease, color .18s ease; }
  .iconbtn:hover{ background:var(--surface); border-color:var(--stroke); color:var(--text-primary); }
  .iconbtn:active{ transform:scale(.94); }
  .iconbtn svg{ width:19px; height:19px; }
  .topbar h1{ flex:1; font-family:var(--font-display); font-style:italic; font-weight:800;
    font-size:18px; text-align:center; padding-right:38px; }

  .scrim{ position:absolute; inset:0; z-index:10; background:rgba(26,20,21,.28); backdrop-filter:blur(2px);
    opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .app.drawer-open .scrim{ opacity:1; pointer-events:auto; }
  .drawer{ position:absolute; top:0; bottom:0; left:0; z-index:11; width:78%; max-width:300px;
    background:linear-gradient(175deg, #ffffff, #f7f1ef); border-right:1px solid var(--stroke);
    transform:translateX(-100%); transition:transform .32s cubic-bezier(.32,.72,.24,1);
    padding:max(20px, env(safe-area-inset-top)) 16px 16px; display:flex; flex-direction:column; gap:4px; }
  .app.drawer-open .drawer{ transform:translateX(0); }
  .drawer h2{ display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:800; font-style:italic; font-size:19px; color:var(--accent); padding:6px 10px 16px; }
  .drawer-mark{ height:28px; width:auto; border-radius:7px; }
  .drawer-item{ display:flex; align-items:center; gap:12px; padding:11px 10px; border-radius:11px;
    color:var(--text-secondary); font-size:14px; font-weight:600;
    cursor:pointer; transition:background .15s ease, color .15s ease; position:relative; }
  .drawer-item.is-active{ color:var(--text-primary); background:var(--surface); }
  .drawer-item:hover{ background:var(--surface); color:var(--text-primary); }
  .drawer-item svg{ width:17px; height:17px; opacity:.8; flex-shrink:0; }
  .drawer-sep{ height:1px; background:var(--stroke); margin:10px 4px; }
  .drawer-foot{ margin-top:auto; padding:10px; font-size:11.5px; color:var(--text-tertiary); }
  .drawer-item .tag{ margin-left:auto; font-size:9.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
    color:var(--accent-bright); background:rgba(200,16,46,.16); border:1px solid rgba(225,37,27,.32); padding:2px 7px; border-radius:100px; }

  .list{ position:relative; z-index:2; flex:1; min-height:0; overflow-y:auto;
    -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:14px 16px 24px;
    display:flex; flex-direction:column; gap:12px; scrollbar-width:thin; scrollbar-color:rgba(225,37,27,.35) transparent; }
  .list::-webkit-scrollbar{ width:5px; }
  .list::-webkit-scrollbar-track{ background:transparent; }
  .list::-webkit-scrollbar-thumb{ background:rgba(225,37,27,.35); border-radius:100px; }
  .list::-webkit-scrollbar-thumb:hover{ background:rgba(225,37,27,.55); }

  .acard{ background:var(--surface); border:1px solid var(--stroke); border-radius:20px; padding:18px; }
  .acard-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .acard-type{ font-size:15px; font-weight:700; color:var(--text-primary); }
  .acard-mod{ font-size:12px; color:var(--text-tertiary); margin-top:2px; }
  .status{ font-size:10.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
    color:var(--good); background:rgba(19,135,75,.14); border:1px solid rgba(19,135,75,.35);
    padding:4px 10px; border-radius:100px; flex-shrink:0; }

  .acard-when{ display:flex; align-items:center; gap:10px; padding:12px 0; border-top:1px solid var(--stroke); border-bottom:1px solid var(--stroke); margin-bottom:12px; }
  .acard-when svg{ width:17px; height:17px; color:var(--accent-bright); flex-shrink:0; }
  .acard-when span{ font-size:13.5px; font-weight:600; }

  .acard-row{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-secondary); margin-bottom:4px; }
  .acard-row svg{ width:14px; height:14px; color:var(--text-tertiary); flex-shrink:0; }

  .acard-actions{ display:flex; gap:8px; margin-top:14px; }
  .abtn{ flex:1; text-align:center; padding:9px; border-radius:11px; font-size:12px; font-weight:700;
    border:1px solid var(--stroke-strong); background:rgba(26,20,21,.02); color:var(--text-secondary);
    cursor:pointer; transition:all .15s ease; position:relative; }
  .abtn:hover{ border-color:var(--accent); color:var(--text-primary); }
  .abtn.danger:hover{ border-color:#c62828; color:#b3261e; }
  .abtn[disabled]{ opacity:.4; cursor:default; }
  .soon{ position:absolute; top:-8px; right:-6px; font-size:8px; font-weight:800; letter-spacing:.04em;
    background:var(--accent); color:#fff; padding:2px 5px; border-radius:100px; text-transform:uppercase; }

  .empty{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    padding:20px 30px; text-align:center; position:relative; z-index:2; }
  .empty .eicon{ width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 30%, rgba(225,37,27,.35), rgba(200,16,46,.05));
    border:1px solid var(--stroke-strong); color:var(--accent-bright); }
  .empty .eicon svg{ width:26px; height:26px; }
  .empty h2{ font-family:var(--font-display); font-style:italic; font-weight:800; font-size:19px; }
  .empty p{ font-size:13.5px; color:var(--text-secondary); max-width:260px; line-height:1.5; }
  .empty a{ margin-top:4px; padding:11px 22px; border-radius:100px; font-size:13px; font-weight:700;
    color:#fff; background:linear-gradient(155deg, var(--accent-bright), var(--accent)); }
  /* Estados y reprogramación */
  .status.st-cancelada, .status.st-no_asistio{ color:var(--text-tertiary) !important; background:rgba(26,20,21,.06) !important; border-color:transparent !important; }
  .status.st-admitido{ color:#141414 !important; background:#f2a900 !important; border-color:transparent !important; }
  .status.st-asistio{ color:#1f6aa8 !important; background:rgba(31,106,168,.12) !important; border-color:transparent !important; }
  .acard.is-closed{ opacity:.72; }
  .slot-pick{ display:flex; flex-direction:column; gap:7px; margin-top:12px; }
  .pick-title{ font-size:12px; font-weight:700; color:var(--text-secondary); }
  .slot-chip{ text-align:left; padding:10px 12px; border-radius:12px; border:1px solid var(--stroke-strong); background:#fff;
    font:inherit; font-size:12.5px; font-weight:600; color:var(--text-primary); cursor:pointer; }
  .slot-chip:hover{ border-color:var(--accent); color:var(--accent); }
  .acard-msg{ font-size:12px; color:var(--text-secondary); margin-top:8px; min-height:0; }
  .acard-msg:empty{ display:none; }
</style>
<link rel="stylesheet" href="../../styles/unilibre.css" />
<script src="../../js/config.js"></script>
</head>
<body>
<div class="stage">
  <div class="app" id="app">
    <div class="ambient"></div>
    <div class="scrim" id="scrim"></div>
    <nav class="drawer" id="drawer">
      <h2><img class="drawer-mark" src="../../icons/unilibre-escudo.png" alt="" />Asistente Unilibre</h2>
      <a class="drawer-item" href="../../index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-11.8 7.8L4 21l1.7-5.2A8.5 8.5 0 1 1 21 11.5Z"/></svg>
        Volver al chat
      </a>
      <a class="drawer-item" href="../programas/index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
        Programas de formación
      </a>
      <a class="drawer-item is-active" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/><path d="M8.5 15.5l1.8 1.8L15.5 13.5"/></svg>
        Mis citas
      </a>
      <a class="drawer-item" href="../proceso/index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M12 20V4M20 20v-7"/></svg>
        Mi proceso
      </a>
      <div class="drawer-sep"></div>
      <a class="drawer-item" href="../asesor/index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="14" width="4" height="6" rx="1.5"/><rect x="17.5" y="14" width="4" height="6" rx="1.5"/><path d="M19.5 20a4 4 0 0 1-4 4h-2"/></svg>
        Panel del asesor <span class="tag">Asesores</span>
      </a>
      <div class="drawer-foot">Universidad Libre &middot; Agente de Admisiones</div>
    </nav>

    <header class="topbar">
      <a class="iconbtn" href="../../index.html" aria-label="Volver al chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <h1>Mis citas</h1>
      <button class="iconbtn" id="menuBtn" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </header>

    <div class="list" id="list"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var CF_KEY = 'cfAdmisionesState';
  var API = (window.UL_CONFIG && window.UL_CONFIG.backendUrl) || '';
  var STATUS_LABEL = { confirmada:'Confirmada', reprogramada:'Reprogramada', asistio:'Asistida', no_asistio:'No asistida', admitido:'Admitido', cancelada:'Cancelada' };
  var ACTIVE = ['confirmada','reprogramada'];

  function loadState(){
    try{
      var raw = localStorage.getItem(CF_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { profile:{}, appointments:[], lastMessages:[] };
  }
  function saveState(state){ try{ localStorage.setItem(CF_KEY, JSON.stringify(state)); }catch(e){} }
  function esc(s){ var d=document.createElement('div'); d.textContent = s==null ? '' : String(s); return d.innerHTML; }
  function cap(s){ s = s || ''; return s.charAt(0).toUpperCase()+s.slice(1); }

  function post(path, body){
    return fetch(API + path, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) })
      .then(function(res){
        return res.json().catch(function(){ return {}; }).then(function(data){
          if(!res.ok){ var err = new Error(data.detail || 'Error'); err.status = res.status; throw err; }
          return data;
        });
      });
  }

  var app = document.getElementById('app');
  document.getElementById('menuBtn').addEventListener('click', function(){ app.classList.add('drawer-open'); });
  document.getElementById('scrim').addEventListener('click', function(){ app.classList.remove('drawer-open'); });

  var listEl = document.getElementById('list');

  function iconCal(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>'; }
  function iconUser(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5"/></svg>'; }
  function iconPin(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="10" r="2.6"/></svg>'; }

  /* Las citas reservadas con el backend traen su código: se consulta su estado real
     (el asesor pudo marcarla como asistida o admitida, o el aspirante reprogramarla). */
  function syncWithBackend(){
    var state = loadState();
    var pending = (state.appointments||[]).filter(function(a){ return a.backendId && a.token; });
    if(!API || !pending.length) return Promise.resolve();
    return Promise.all(pending.map(function(a){
      return post('/appointments/'+a.backendId+'/status', { token:a.token }).then(function(remote){
        a.status = remote.status; a.label = remote.slot_label; a.iso = remote.slot_iso; a.asesor = remote.asesor;
      }).catch(function(){});
    })).then(function(){ saveState(state); });
  }

  function updateProfile(state, appt){
    if(!state.profile || !state.profile.cita || state.profile.cita.id !== appt.id) return;
    if(appt.status === 'cancelada'){
      state.profile.cita = null;
      state.profile.proximaAccion = 'Agendar una nueva cita';
    }else{
      state.profile.cita = appt;
      state.profile.proximaAccion = 'Asistir a la cita de '+appt.tipo.toLowerCase()+' el '+appt.label;
    }
  }

  function render(){
    var state = loadState();
    var appts = (state.appointments||[]).slice().sort(function(a,b){
      var aActive = ACTIVE.indexOf(a.status||'confirmada') > -1, bActive = ACTIVE.indexOf(b.status||'confirmada') > -1;
      if(aActive !== bActive) return aActive ? -1 : 1;
      return new Date(a.iso) - new Date(b.iso);
    });

    if(!appts.length){
      listEl.innerHTML =
        '<div class="empty">'+
          '<div class="eicon">'+iconCal()+'</div>'+
          '<h2>Aún no tienes citas</h2>'+
          '<p>Cuéntale al asistente qué necesitas y te ayudará a agendar una cita con un asesor de admisiones.</p>'+
          '<a href="../../index.html">Ir al chat</a>'+
        '</div>';
      return;
    }

    listEl.innerHTML = '';
    appts.forEach(function(a){
      var status = a.status || 'confirmada';
      var active = ACTIVE.indexOf(status) > -1;
      var online = !!(a.backendId && a.token && API);
      var card = document.createElement('div');
      card.className = 'acard' + (active ? '' : ' is-closed');
      card.innerHTML =
        '<div class="acard-top">'+
          '<div><div class="acard-type">'+esc(a.tipo)+'</div><div class="acard-mod">'+esc(a.modalidad)+'</div></div>'+
          '<span class="status st-'+esc(status)+'">'+esc(STATUS_LABEL[status] || status)+'</span>'+
        '</div>'+
        '<div class="acard-when">'+iconCal()+'<span>'+esc(cap(a.label))+'</span></div>'+
        '<div class="acard-row">'+iconUser()+'<span>'+esc(a.asesor)+'</span></div>'+
        (a.contexto && a.contexto.programa ? '<div class="acard-row">'+iconPin()+'<span>Interés: '+esc(a.contexto.programa)+(a.contexto.sede?' · '+esc(a.contexto.sede):'')+'</span></div>' : '')+
        (active ?
          '<div class="acard-actions">'+
            '<button type="button" class="abtn" data-act="reschedule"'+(online?'':' disabled title="Disponible cuando la cita está reservada en la agenda"')+'>Reprogramar</button>'+
            '<button type="button" class="abtn danger" data-act="cancel">Cancelar</button>'+
          '</div>'+
          '<div class="slot-pick" hidden></div>'+
          '<p class="acard-msg" role="status"></p>'
        : '');
      listEl.appendChild(card);
      if(!active) return;

      var msg = card.querySelector('.acard-msg');
      card.querySelector('[data-act="cancel"]').addEventListener('click', function(){
        if(!confirm('¿Cancelar tu cita del '+a.label+'?')) return;
        if(!online){
          var s = loadState();
          s.appointments = (s.appointments||[]).filter(function(x){ return x.id !== a.id; });
          a.status = 'cancelada'; updateProfile(s, a); saveState(s); render();
          return;
        }
        msg.textContent = 'Cancelando…';
        post('/appointments/'+a.backendId+'/cancel', { token:a.token }).then(function(remote){
          var s = loadState();
          s.appointments.forEach(function(x){ if(x.id === a.id){ x.status = remote.status; updateProfile(s, x); } });
          saveState(s); render();
        }).catch(function(err){ msg.textContent = 'No se pudo cancelar: '+err.message; });
      });

      var pick = card.querySelector('.slot-pick');
      card.querySelector('[data-act="reschedule"]').addEventListener('click', function(){
        if(!pick.hidden){ pick.hidden = true; return; }
        pick.hidden = false;
        pick.innerHTML = '<span class="pick-title">Cargando horarios libres…</span>';
        fetch(API + '/availability?tipo=' + encodeURIComponent(a.tipo) + '&limit=4')
          .then(function(res){ return res.json(); })
          .then(function(data){
            var slots = data.slots || [];
            if(!slots.length){ pick.innerHTML = '<span class="pick-title">No hay horarios libres en las próximas dos semanas.</span>'; return; }
            pick.innerHTML = '<span class="pick-title">Elige un nuevo horario:</span>';
            slots.forEach(function(slot){
              var b = document.createElement('button');
              b.type = 'button'; b.className = 'slot-chip';
              b.textContent = cap(slot.label) + ' · ' + slot.asesor;
              b.addEventListener('click', function(){
                msg.textContent = 'Reprogramando…';
                post('/appointments/'+a.backendId+'/reschedule', { token:a.token, slot_iso:slot.iso, asesor:slot.asesor }).then(function(remote){
                  var s = loadState();
                  s.appointments.forEach(function(x){
                    if(x.id === a.id){ x.status = remote.status; x.label = remote.slot_label; x.iso = remote.slot_iso; x.asesor = remote.asesor; updateProfile(s, x); }
                  });
                  saveState(s); render();
                }).catch(function(err){
                  msg.textContent = err.status === 409 ? 'Ese horario se acaba de ocupar. Elige otro.' : 'No se pudo reprogramar: '+err.message;
                });
              });
              pick.appendChild(b);
            });
          })
          .catch(function(){ pick.innerHTML = '<span class="pick-title">No se pudo consultar la agenda. Intenta más tarde.</span>'; });
      });
    });
  }

  render();
  syncWithBackend().then(render);
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('/sw.js'); });
  }
</script>
</body>
</html>
