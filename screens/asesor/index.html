<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Panel del asesor · Asistente Unilibre</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#c8102e" />
<meta name="color-scheme" content="light" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Asistente Unilibre" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --bg-well:#f3eeec; --surface:#faf7f6; --surface-2:#f2ebe9;
    --stroke:rgba(26,20,21,.11); --stroke-strong:rgba(26,20,21,.22);
    --text-primary:#1a1415; --text-secondary:#4d4344; --text-tertiary:#6f6466;
    --accent:#c8102e; --accent-bright:#e1251b; --info:#1f6aa8;
    --shadow-ambient:rgba(200,16,46,.22);
    --sun: #f2a900;
    --leaf: #e1251b;
    --font-display:'Playfair Display', Georgia, 'Times New Roman', serif;
    --font-sans:'Manrope',-apple-system,'Segoe UI',sans-serif;
    --font-mono:'JetBrains Mono','SFMono-Regular',Menlo,monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; overscroll-behavior:none; }
  body{ background:var(--bg-well); color:var(--text-primary); font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased; }
  button{ font-family:inherit; }
  a{ color:inherit; text-decoration:none; }

  .stage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(60% 45% at 50% 0%, rgba(31,106,168,.10), transparent 70%), var(--bg-well); }
  .app{ position:relative; width:100%; max-width:460px; height:100%; max-height:960px;
    display:flex; flex-direction:column; overflow:hidden; background:var(--bg); isolation:isolate; }
  @media (min-width:680px){
    .app{ height:min(92dvh, 960px); border-radius:28px;
      box-shadow:0 0 0 1px var(--stroke), 0 40px 100px -20px rgba(26,20,21,.24), 0 0 140px -50px var(--shadow-ambient); }
  }
  .ambient{ position:absolute; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(70% 38% at 50% 86%, rgba(200,16,46,.09), transparent 65%),
      radial-gradient(90% 42% at 50% 106%, rgba(242,169,0,.16), transparent 70%),
      linear-gradient(180deg, #ffffff 0%, #fdfbfa 55%, #f6efed 100%); }

  .topbar{ position:relative; z-index:3; display:flex; align-items:center; gap:12px;
    padding:max(16px, env(safe-area-inset-top)) 16px 12px; flex-shrink:0; border-bottom:1px solid var(--stroke); }
  .iconbtn{ width:36px; height:36px; border-radius:11px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:1px solid transparent; color:var(--text-secondary);
    cursor:pointer; transition:background .18s ease, border-color .18s ease, color .18s ease; }
  .iconbtn:hover{ background:var(--surface); border-color:var(--stroke); color:var(--text-primary); }
  .iconbtn svg{ width:18px; height:18px; }
  .topbar-title{ flex:1; display:flex; flex-direction:column; }
  .topbar-title strong{ font-size:14.5px; font-weight:700; }
  .topbar-title span{ font-size:11px; color:var(--text-tertiary); }
  .panel-badge{ font-size:9.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
    color:var(--info); background:rgba(31,106,168,.14); border:1px solid rgba(31,106,168,.32);
    padding:4px 9px; border-radius:100px; flex-shrink:0; }

  .content{ position:relative; z-index:2; flex:1; min-height:0; overflow-y:auto;
    -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:18px 18px 26px;
    display:flex; flex-direction:column; gap:16px; scrollbar-width:thin; scrollbar-color:rgba(31,106,168,.4) transparent; }
  .content::-webkit-scrollbar{ width:5px; }
  .content::-webkit-scrollbar-track{ background:transparent; }
  .content::-webkit-scrollbar-thumb{ background:rgba(31,106,168,.4); border-radius:100px; }
  .content::-webkit-scrollbar-thumb:hover{ background:rgba(31,106,168,.6); }

  .lead{ display:flex; align-items:center; gap:14px; }
  .avatar{ width:48px; height:48px; border-radius:50%; flex-shrink:0;
    background:radial-gradient(circle at 35% 30%, #f2a900, var(--accent) 45%, #8a0b1f 100%);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; color:#fff; }
  .lead h1{ font-family:var(--font-display); font-style:italic; font-weight:800; font-size:19px; }
  .lead p{ font-size:12px; color:var(--text-tertiary); margin-top:2px; }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat{ background:var(--surface); border:1px solid var(--stroke); border-radius:16px; padding:13px 14px; }
  .stat dt{ font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:6px; }
  .stat dd{ font-size:14px; font-weight:700; }
  .stat.span2{ grid-column:1 / -1; }
  .pill{ display:inline-block; font-size:10.5px; font-weight:800; padding:3px 10px; border-radius:100px; }
  .pill.alto{ color:#8a0b1f; background:rgba(200,16,46,.16); border:1px solid rgba(225,37,27,.35); }
  .pill.medio{ color:#7a5600; background:rgba(242,169,0,.14); border:1px solid rgba(242,169,0,.32); }
  .pill.bajo{ color:var(--text-secondary); background:rgba(26,20,21,.04); border:1px solid var(--stroke-strong); }

  .section-title{ font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--text-tertiary); margin:4px 0 -4px; }

  .appt-card{ background:linear-gradient(155deg, rgba(31,106,168,.12), rgba(31,106,168,.02));
    border:1px solid rgba(31,106,168,.28); border-radius:16px; padding:15px; display:flex; gap:12px; align-items:flex-start; }
  .appt-card svg{ width:18px; height:18px; color:var(--info); flex-shrink:0; margin-top:2px; }
  .appt-card strong{ display:block; font-size:13.5px; }
  .appt-card span{ font-size:12px; color:var(--text-secondary); display:block; margin-top:2px; }

  .transcript{ background:var(--surface); border:1px solid var(--stroke); border-radius:16px; padding:14px; }
  .t-row{ display:flex; gap:10px; padding:7px 0; font-size:12.5px; line-height:1.5; border-bottom:1px solid var(--stroke); }
  .t-row:last-child{ border-bottom:none; }
  .t-role{ flex-shrink:0; width:56px; font-family:var(--font-mono); font-size:10px; font-weight:600;
    text-transform:uppercase; letter-spacing:.04em; padding-top:1px; }
  .t-row.user .t-role{ color:var(--accent-bright); }
  .t-row.bot .t-role{ color:var(--info); }
  .t-text{ color:var(--text-secondary); }

  .empty{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:20px; }
  .empty svg{ width:34px; height:34px; color:var(--text-tertiary); }
  .empty h2{ font-family:var(--font-display); font-style:italic; font-weight:800; font-size:18px; }
  .empty p{ font-size:13px; color:var(--text-secondary); max-width:270px; line-height:1.5; }
  .empty a{ margin-top:2px; padding:11px 22px; border-radius:100px; font-size:13px; font-weight:700;
    color:#fff; background:linear-gradient(155deg, var(--accent-bright), var(--accent)); }

  .foot-note{ text-align:center; font-size:10.5px; color:var(--text-tertiary); padding:0 20px 4px; }
  /* ============ Panel del asesor (conectado al backend) ============ */
  .tabs{ position:relative; z-index:2; display:flex; gap:6px; padding:14px 18px 0; flex-shrink:0; }
  .tab{ flex:1; padding:9px 6px; border-radius:100px; border:1px solid var(--stroke-strong); background:#fff;
    font-size:12px; font-weight:700; color:var(--text-secondary); cursor:pointer; }
  .tab.is-active{ background:#141414; color:#fff; border-color:#141414; box-shadow:inset 0 -2px 0 #f2a900; }
  .tab .count{ display:inline-block; margin-left:5px; font-size:10px; padding:1px 7px; border-radius:100px; background:rgba(200,16,46,.12); color:#8a0b1f; }
  .tab.is-active .count{ background:#f2a900; color:#141414; }

  .login{ margin:auto; width:100%; max-width:320px; display:flex; flex-direction:column; gap:12px; text-align:center; }
  .login h2{ font-family:var(--font-display); font-weight:700; font-size:20px; }
  .login p{ font-size:13px; color:var(--text-secondary); line-height:1.5; }
  .login input{ padding:12px 16px; border-radius:100px; border:1px solid var(--stroke-strong); font:inherit; font-size:14px; outline:none; }
  .login input:focus{ border-color:var(--accent); }
  .login button, .btn{ padding:12px 18px; border-radius:100px; border:0; cursor:pointer; font-weight:700; font-size:13px;
    color:#fff; background:linear-gradient(160deg, #d6152f, #c8102e 48%, #8a0b1f); }
  .login .err{ color:#b3261e; font-size:12.5px; min-height:16px; }
  .link-btn{ background:none; border:0; color:var(--text-tertiary); font-size:11.5px; font-weight:700; cursor:pointer; text-decoration:underline; }

  .filters{ display:flex; gap:6px; flex-wrap:wrap; }
  .fchip{ padding:6px 12px; border-radius:100px; border:1px solid var(--stroke-strong); background:#fff; font-size:11.5px; font-weight:700; color:var(--text-secondary); cursor:pointer; }
  .fchip.is-active{ border-color:var(--accent); color:var(--accent); background:rgba(200,16,46,.06); }

  .acard{ background:#fff; border:1px solid var(--stroke); border-radius:16px; padding:14px 15px; display:flex; flex-direction:column; gap:8px;
    box-shadow:0 14px 30px -26px rgba(26,20,21,.4); }
  .acard-head{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .acard-head strong{ font-size:14px; display:block; }
  .acard-head small{ font-size:11.5px; color:var(--text-tertiary); display:block; margin-top:2px; word-break:break-all; }
  .acard-when{ font-size:12.5px; font-weight:700; color:#8a0b1f; }
  .acard-meta{ font-size:12px; color:var(--text-secondary); line-height:1.5; }
  .acard select{ font:inherit; font-size:11.5px; font-weight:700; padding:6px 8px; border-radius:10px; border:1px solid var(--stroke-strong); background:#fff; }
  .st{ display:inline-block; font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding:3px 9px; border-radius:100px; }
  .st.confirmada, .st.reprogramada{ color:#13874b; background:rgba(19,135,75,.12); }
  .st.admitido{ color:#141414; background:#f2a900; }
  .st.asistio{ color:#1f6aa8; background:rgba(31,106,168,.12); }
  .st.no_asistio, .st.cancelada{ color:var(--text-tertiary); background:rgba(26,20,21,.06); }
  details.convo summary{ cursor:pointer; font-size:12px; font-weight:700; color:var(--accent); }
  details.convo .transcript{ margin-top:8px; }

  .uq{ background:#fff; border:1px solid var(--stroke); border-radius:14px; padding:12px 14px; display:flex; gap:12px; align-items:flex-start; }
  .uq b{ flex-shrink:0; min-width:30px; text-align:center; font-size:12px; padding:3px 0; border-radius:100px; background:rgba(200,16,46,.1); color:#8a0b1f; }
  .uq span{ font-size:13px; line-height:1.45; }
  .uq small{ display:block; font-size:11px; color:var(--text-tertiary); margin-top:3px; }
  .note{ font-size:12px; color:var(--text-secondary); line-height:1.5; background:rgba(242,169,0,.1); border-left:3px solid #f2a900; padding:10px 12px; border-radius:8px; }
</style>
<link rel="stylesheet" href="../../styles/unilibre.css" />
<script src="../../js/config.js"></script>
</head>
<body>
<div class="stage">
  <div class="app" id="app">
    <div class="ambient"></div>
    <header class="topbar">
      <a class="iconbtn" href="../../index.html" aria-label="Volver al chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <div class="topbar-title">
        <strong>Panel del asesor</strong>
        <span>Admisiones · Seccional Barranquilla</span>
      </div>
      <span class="panel-badge" id="badge">Asesor</span>
    </header>

    <nav class="tabs" id="tabs" role="tablist" hidden>
      <button class="tab is-active" data-tab="citas" role="tab">Citas<span class="count" id="countCitas"></span></button>
      <button class="tab" data-tab="preguntas" role="tab">Sin respuesta<span class="count" id="countPreg"></span></button>
      <button class="tab" data-tab="sesion" role="tab">Esta sesión</button>
    </nav>

    <div class="content" id="content" aria-live="polite"></div>
    <p class="foot-note">Panel interno de admisiones. Los datos de los aspirantes son confidenciales.</p>
  </div>
</div>

<script>
(function(){
  "use strict";
  var API = (window.UL_CONFIG && window.UL_CONFIG.backendUrl) || '';
  var KEY_STORE = 'ulAdminKey';
  var CF_KEY = 'cfAdmisionesState';
  var content = document.getElementById('content');
  var tabsEl = document.getElementById('tabs');
  var activeTab = 'citas';
  var statusFilter = 'activas';
  var appointments = [], unanswered = [];

  var STATUS_LABEL = { confirmada:'Confirmada', reprogramada:'Reprogramada', asistio:'Asistió', no_asistio:'No asistió', admitido:'Admitido', cancelada:'Cancelada' };
  var FILTERS = { activas:['confirmada','reprogramada'], todas:null, admitido:['admitido'], cerradas:['asistio','no_asistio','cancelada'] };

  function esc(s){ var d=document.createElement('div'); d.textContent = s==null ? '' : String(s); return d.innerHTML; }
  function cap(s){ s = s || ''; return s.charAt(0).toUpperCase()+s.slice(1); }
  function getKey(){ try{ return sessionStorage.getItem(KEY_STORE) || ''; }catch(e){ return ''; } }
  function setKey(k){ try{ if(k) sessionStorage.setItem(KEY_STORE, k); else sessionStorage.removeItem(KEY_STORE); }catch(e){} }

  function api(path, opts){
    opts = opts || {};
    return fetch(API + path, {
      method: opts.method || 'GET',
      headers: { 'Content-Type':'application/json', 'X-Admin-Key': getKey() },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function(res){
      return res.json().catch(function(){ return {}; }).then(function(data){
        if(!res.ok){ var err = new Error(data.detail || ('Error '+res.status)); err.status = res.status; throw err; }
        return data;
      });
    });
  }

  /* ---------- Acceso ---------- */
  function renderLogin(message){
    tabsEl.hidden = true;
    content.innerHTML =
      '<form class="login" id="loginForm">'+
        '<h2>Acceso de asesores</h2>'+
        '<p>Ingresa la clave del panel (ADMIN_API_KEY en el archivo .env del backend).</p>'+
        '<input type="password" id="keyInput" placeholder="Clave del panel" autocomplete="current-password" required />'+
        '<button type="submit">Entrar</button>'+
        '<div class="err" id="loginErr">'+esc(message||'')+'</div>'+
        '<button type="button" class="link-btn" id="demoBtn">Ver solo la sesión de este navegador (demo)</button>'+
      '</form>';
    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      setKey(document.getElementById('keyInput').value.trim());
      load();
    });
    document.getElementById('demoBtn').addEventListener('click', function(){
      tabsEl.hidden = false; selectTab('sesion');
    });
    document.getElementById('keyInput').focus();
  }

  function load(){
    if(!API){ tabsEl.hidden = false; selectTab('sesion'); return; }
    if(!getKey()){ renderLogin(); return; }
    content.innerHTML = '<p class="foot-note">Cargando…</p>';
    Promise.all([api('/admin/appointments'), api('/admin/unanswered')]).then(function(r){
      appointments = r[0].appointments || [];
      unanswered = r[1].questions || [];
      tabsEl.hidden = false;
      updateCounts();
      selectTab(activeTab);
    }).catch(function(err){
      if(err.status === 401){ setKey(''); renderLogin('Clave incorrecta.'); }
      else if(err.status === 503){ setKey(''); renderLogin('El panel está deshabilitado: falta ADMIN_API_KEY en el .env del backend.'); }
      else { renderLogin('No se pudo conectar con el backend. ¿Está encendido?'); }
    });
  }

  function updateCounts(){
    var active = appointments.filter(function(a){ return FILTERS.activas.indexOf(a.status) > -1; }).length;
    document.getElementById('countCitas').textContent = active || '';
    document.getElementById('countPreg').textContent = unanswered.length || '';
  }

  function selectTab(tab){
    activeTab = tab;
    Array.prototype.forEach.call(tabsEl.querySelectorAll('.tab'), function(b){
      var on = b.getAttribute('data-tab') === tab;
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-selected', String(on));
    });
    if(tab === 'citas') renderCitas();
    else if(tab === 'preguntas') renderPreguntas();
    else renderSesion();
  }
  tabsEl.addEventListener('click', function(e){
    var b = e.target.closest('.tab');
    if(b) selectTab(b.getAttribute('data-tab'));
  });

  /* ---------- Citas ---------- */
  function transcriptHtml(list){
    if(!list || !list.length) return '<div class="transcript"><div class="t-row"><div class="t-text">Sin conversación registrada.</div></div></div>';
    return '<div class="transcript">'+list.map(function(m){
      return '<div class="t-row '+(m.role==='user'?'user':'bot')+'"><div class="t-role">'+(m.role==='user'?'Aspirante':'Agente')+'</div><div class="t-text">'+esc(m.text)+'</div></div>';
    }).join('')+'</div>';
  }

  function renderCitas(){
    if(!getKey()){ renderLogin(); return; }
    var allowed = FILTERS[statusFilter];
    var list = appointments.filter(function(a){ return !allowed || allowed.indexOf(a.status) > -1; });
    var html = '<div class="filters">'+
      [['activas','Activas'],['todas','Todas'],['admitido','Admitidos'],['cerradas','Cerradas']].map(function(f){
        return '<button class="fchip'+(statusFilter===f[0]?' is-active':'')+'" data-filter="'+f[0]+'">'+f[1]+'</button>';
      }).join('')+'</div>';
    if(!list.length){
      html += '<div class="empty"><h2>No hay citas aquí</h2><p>Las citas que agenden los aspirantes en el chat aparecerán en esta lista.</p></div>';
    }
    list.forEach(function(a){
      var options = Object.keys(STATUS_LABEL).map(function(s){
        return '<option value="'+s+'"'+(a.status===s?' selected':'')+'>'+STATUS_LABEL[s]+'</option>';
      }).join('');
      html += '<article class="acard">'+
        '<div class="acard-head"><div><strong>'+esc(a.nombre || a.email)+'</strong><small>'+esc(a.email)+(a.telefono?' · '+esc(a.telefono):'')+'</small></div>'+
          '<span class="st '+esc(a.status)+'">'+esc(STATUS_LABEL[a.status] || a.status)+'</span></div>'+
        '<div class="acard-when">'+esc(cap(a.slot_label))+'</div>'+
        '<div class="acard-meta">'+esc(a.tipo)+' · '+esc(a.modalidad)+' · con '+esc(a.asesor)+
          (a.programa ? '<br>Programa de interés: <b>'+esc(a.programa)+'</b>' : '')+
          (a.necesidad ? '<br>Necesidad: '+esc(a.necesidad) : '')+
          (a.call_summary ? '<br>Resumen de la llamada: '+esc(a.call_summary) : '')+'</div>'+
        '<label class="acard-meta">Estado: <select data-id="'+a.id+'">'+options+'</select></label>'+
        '<details class="convo"><summary>Ver conversación con el agente</summary>'+transcriptHtml(a.chat_transcript)+'</details>'+
      '</article>';
    });
    content.innerHTML = html;
  }
  content.addEventListener('click', function(e){
    var f = e.target.closest('[data-filter]');
    if(f){ statusFilter = f.getAttribute('data-filter'); renderCitas(); }
  });
  content.addEventListener('change', function(e){
    var sel = e.target.closest('select[data-id]');
    if(!sel) return;
    var id = Number(sel.getAttribute('data-id'));
    sel.disabled = true;
    api('/admin/appointments/'+id, { method:'PATCH', body:{ status: sel.value } }).then(function(row){
      appointments = appointments.map(function(a){ return a.id === id ? row : a; });
      updateCounts(); renderCitas();
    }).catch(function(err){
      sel.disabled = false;
      alert('No se pudo actualizar la cita: '+err.message);
    });
  });

  /* ---------- Preguntas sin respuesta ---------- */
  function renderPreguntas(){
    var html = '<p class="note">Preguntas que el agente no pudo responder con los documentos. Agrega esa información al PDF de la Universidad y vuelve a cargarlo (python ingest.py --reset).</p>';
    if(!unanswered.length){
      html += '<div class="empty"><h2>Todo respondido</h2><p>Aún no hay preguntas sin respuesta registradas.</p></div>';
    }
    unanswered.forEach(function(q){
      var when = q.ultima ? new Date(q.ultima).toLocaleString('es-CO', { dateStyle:'medium', timeStyle:'short' }) : '';
      html += '<div class="uq"><b>'+esc(q.veces)+'×</b><span>'+esc(q.question)+'<small>Última vez: '+esc(when)+'</small></span></div>';
    });
    if(getKey()) html += '<button class="link-btn" id="logoutBtn" style="align-self:center">Cerrar sesión del panel</button>';
    content.innerHTML = html;
    var lo = document.getElementById('logoutBtn');
    if(lo) lo.addEventListener('click', function(){ setKey(''); renderLogin(); });
  }

  /* ---------- Sesión de este navegador (demo) ---------- */
  function renderSesion(){
    var state = { profile:{}, appointments:[], lastMessages:[] };
    try{ var raw = localStorage.getItem(CF_KEY); if(raw) state = JSON.parse(raw); }catch(e){}
    var p = state.profile || {};
    var messages = state.lastMessages || [];
    if(!p.programa && !p.necesidad && !messages.length){
      content.innerHTML = '<div class="empty"><h2>Sin conversación en este navegador</h2>'+
        '<p>Esta pestaña muestra la conversación del chat abierto en este mismo navegador.</p><a href="../../index.html">Ir al chat</a></div>';
      return;
    }
    var interesClass = p.interes==='Alto' ? 'alto' : (p.interes==='Bajo' ? 'bajo' : 'medio');
    var html = '<div class="lead"><div class="avatar">A</div><div><h1>Aspirante</h1><p>Sesión web en este navegador</p></div></div>'+
      '<div class="grid">'+
        stat('Programa de interés', esc(p.programa || 'No definido'))+
        stat('Sede', esc(p.sede || 'No definida'))+
        stat('Interés', '<span class="pill '+interesClass+'">'+esc(p.interes||'Medio')+'</span>')+
        stat('Etapa', esc(p.etapa || 'Exploración'))+
        stat('Necesidad principal', esc(p.necesidad || 'Sin especificar'), true)+
      '</div>'+
      '<div class="section-title">Transcripción reciente</div>'+transcriptHtml(messages.slice(-10));
    content.innerHTML = html;
  }
  function stat(label, valueHtml, span2){
    return '<dl class="stat'+(span2?' span2':'')+'"><dt>'+label+'</dt><dd>'+valueHtml+'</dd></dl>';
  }

  load();
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('/sw.js'); });
  }
</script>
</body>
